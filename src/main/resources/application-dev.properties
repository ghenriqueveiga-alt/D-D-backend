# ==========================================================================
# Perfil DEV — PostgreSQL com schema gerenciado pelo Hibernate.
# O Hibernate CRIA/ATUALIZA as tabelas a partir das entidades (ddl-auto=update),
# sem Liquibase. Ideal para desenvolvimento local.
# ATENÇÃO: nunca use "create" aqui — ele apaga e recria as tabelas vazias
# a cada subida, destruindo os dados. "update" só adiciona o que falta.
# ==========================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dd_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.liquibase.enabled=false
