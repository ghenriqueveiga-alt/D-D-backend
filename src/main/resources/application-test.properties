# ==========================================================================
# Perfil TEST — H2 em memória com console de inspeção.
# Usado pelos testes JUnit (@ActiveProfiles("test")) e também ao rodar a
# aplicação com --spring.profiles.active=test:
#   http://localhost:8080/h2-console  (JDBC URL abaixo, usuário sa)
# O schema é criado pelas entidades Hibernate (create-drop); Liquibase fica
# desligado para não depender do PostgreSQL.
# ==========================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false
