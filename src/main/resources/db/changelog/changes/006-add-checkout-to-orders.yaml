databaseChangeLog:
  - changeSet:
      id: 006-add-checkout-to-orders
      author: dd
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: recipient_name
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(32)
              - column:
                  name: cep
                  type: VARCHAR(9)
              - column:
                  name: street
                  type: VARCHAR(255)
              - column:
                  name: address_number
                  type: VARCHAR(16)
              - column:
                  name: complement
                  type: VARCHAR(255)
              - column:
                  name: city
                  type: VARCHAR(128)
              - column:
                  name: uf
                  type: VARCHAR(2)
              - column:
                  name: shipping
                  type: NUMERIC(19,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
