# ==========================================================================
# Perfil PROD — PostgreSQL com schema gerenciado pelo Liquibase.
# As migrations vivem em src/main/resources/db/changelog/ e o Hibernate
# apenas valida o schema (ddl-auto=validate), nunca o altera.
# ==========================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dd_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
