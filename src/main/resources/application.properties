spring.application.name=D-D-backend

# Perfil padrão quando nenhum é informado explicitamente.
#   dev  -> PostgreSQL + Hibernate (schema gerenciado pelo Hibernate)
#   prod -> Liquibase + PostgreSQL + Hibernate (validação do schema)
#   test -> H2 em memória + h2-console (usado também pelos testes JUnit)
spring.profiles.default=dev

# ===================== Servidor =====================
server.port=${SERVER_PORT:8080}

# ===================== JPA / Hibernate (comum) =====================
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ===================== SpringDoc / Swagger =====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorters=method
springdoc.packages-to-scan=com.dd.backend
